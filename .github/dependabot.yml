version: 2
updates:
  # Runtime and development pins (requirements.txt / requirements-dev.txt).
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      development-tools:
        patterns:
          - "pytest*"
          - "ruff"
          - "pyinstaller"

  # Action versions used by the workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
