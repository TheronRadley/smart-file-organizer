name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      # Split from the GUI test so a desktop-session problem cannot hide a logic
      # failure, and so the step name says which kind of problem occurred.
      - name: Test (core and safety regression)
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --ignore=tests/test_startup_smoke.py 2>&1 | tee pytest-output.txt

      # The core tests never import tkinter, so a broken window would only show
      # up here. Windows runners have a desktop session, so a skip is a failure:
      # SFO_REQUIRE_GUI makes the test fail instead of skipping.
      - name: GUI startup smoke test
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          SFO_REQUIRE_GUI: "1"
        run: |
          set -o pipefail
          python -m pytest tests/test_startup_smoke.py -v -rs 2>&1 | tee pytest-output.txt

      - name: Share failure details on the pull request
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "### Test failure on \`${{ matrix.os }}\` (run ${{ github.run_id }})"
            echo
            echo '```'
            tail -n 100 pytest-output.txt 2>/dev/null || echo "(no pytest output; an earlier step failed)"
            echo '```'
          } > failure-details.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file failure-details.md

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit==2.10.1

      - name: Check pinned dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt -r requirements-dev.txt --strict
